<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Políglota · Overlay</title>
<style>
  /* Fondo transparente a proposito: esta pagina se usa como Browser Source de
     OBS sobre el video del orador. Todo el contraste lo da el contorno del texto. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: flex-end; justify-content: center;
    font: 600 34px/1.34 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 6vw 6vh;
  }
  #box { max-width: 1400px; text-align: center; }
  .line {
    display: inline-block; margin: 5px 0; padding: 7px 20px;
    background: rgba(8, 10, 16, .76);
    border-radius: 10px;
    color: #fff;
    /* El contorno mantiene el texto legible aunque OBS quite el fondo. */
    text-shadow: 0 2px 10px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.95);
    animation: rise .18s ease-out;
  }
  .line.pending { opacity: .82; }
  /* Desplazamiento corto al subir una línea: ayuda a seguir la lectura sin
     distraer. Se anula para quien pidió menos movimiento en su sistema. */
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } }
  @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  .line.src { font-size: .62em; font-weight: 500; opacity: .72; }
  body.clean .line { background: none; }

  /* QR para la audiencia: se proyecta con la charla y cada quien se lleva los
     subtítulos al teléfono en su idioma. Discreto para no competir con el
     orador, pero legible desde las últimas filas. */
  #qr {
    position: fixed; right: 2.2vw; bottom: 2.2vh;
    background: #fff; padding: 10px 10px 6px; border-radius: 10px;
    display: none; text-align: center;
  }
  #qr img { display: block; width: 116px; height: 116px; }
  #qr span {
    display: block; margin-top: 5px; font-size: 10px; font-weight: 700;
    color: #0b0d12; letter-spacing: .02em; text-transform: uppercase;
  }
  body.qr #qr { display: block; }
</style>
</head>
<body>
<div id="box"></div>
<div id="qr"><img alt="Código QR para ver los subtítulos en el teléfono"><span>Subtítulos en tu idioma</span></div>
<script type="module">
const room = decodeURIComponent(location.pathname.split('/').pop());
const p = new URLSearchParams(location.search);
const lang = p.get('lang') || 'es';
// ?lines=1 para una sola linea, ?clean=1 para quitar el fondo de las cajas,
// ?src=1 para mostrar tambien el idioma original debajo.
const MAX = Math.max(1, parseInt(p.get('lines') || '2', 10));
const showSrc = p.get('src') === '1';
if (p.get('clean') === '1') document.body.classList.add('clean');
// ?qr=1 muestra el código para que la audiencia lea en su propio idioma.
if (p.get('qr') === '1') {
  document.body.classList.add('qr');
  document.querySelector('#qr img').src = `/qr/${room}`;
}

import { CaptionBuffer } from '/static/captions.js';

let sourceLang = 'en', ws;
const box = document.getElementById('box');

// Roll-up: dos líneas firmes arriba y la frase en curso abajo. El buffer se
// encarga del corte a 42 caracteres, del tiempo mínimo de lectura y de ocultar
// el historial cuando el orador se calla.
const captions = new CaptionBuffer({
  maxHistory: MAX,
  maxChars: parseInt(p.get('chars') || '42', 10),
  idleMs: parseInt(p.get('idle') || '6000', 10),
  onRender: render,
});
// El tiempo mínimo de lectura sólo avanza con el reloj, no con texto nuevo:
// sin este latido, la última línea se quedaría clavada en pantalla.
setInterval(() => captions.tick(), 250);

// Qué línea del motor corresponde a cada línea en pantalla, para que una
// corrección del modelo actualice la que ya se está leyendo.
const placed = new Map();

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/view/${room}?lang=${lang}`);
  ws.onmessage = ({ data }) => handle(JSON.parse(data));
  ws.onclose = () => setTimeout(connect, 1500);
}

function pick(ev, textKey) {
  if (lang === sourceLang) return ev[textKey];
  return null;
}

function handle(ev) {
  if (ev.type === 'state') { sourceLang = ev.source_lang || sourceLang; return; }

  if (ev.type === 'translation') {
    const text = ev.tr[lang];
    if (!text) return;
    if (ev.final) {
      if (placed.has(ev.seq)) captions.revise(placed.get(ev.seq), text);
      else commit(ev.seq, text);
    } else {
      captions.setPartial(text);
    }
    return;
  }

  if (ev.type !== 'segment') return;
  // Con traducción activa esperamos el texto traducido; en el idioma original
  // el segmento ya es lo que hay que mostrar.
  if (lang !== sourceLang) {
    if (!ev.final) captions.setPartial(ev.text);   // original atenuado mientras llega
    return;
  }
  if (ev.final) commit(ev.seq, ev.text, ev.speaker);
  else captions.setPartial(ev.text, ev.speaker);
}

function commit(seq, text, speaker) {
  if (placed.has(seq)) { captions.revise(placed.get(seq), text); return; }
  captions.commit(text, speaker || null);
  const shown = captions.visible.history;
  if (shown.length) placed.set(seq, shown[shown.length - 1].index);
}

function render({ history, partial }) {
  box.innerHTML = '';
  for (const line of history) {
    const el = document.createElement('div');
    el.className = 'line';
    el.textContent = line.text;
    box.appendChild(el);
    box.appendChild(document.createElement('br'));
  }
  if (partial) {
    const el = document.createElement('div');
    el.className = 'line pending';
    el.textContent = partial;
    box.appendChild(el);
  }
}

connect();
</script>
</body>
</html>
