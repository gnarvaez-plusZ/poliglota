<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Políglota · Overlay</title>
<style>
  /* Fondo transparente a proposito: esta pagina se usa como Browser Source de
     OBS sobre el video del orador. Todo el contraste lo da el contorno del texto. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: flex-end; justify-content: center;
    font: 600 34px/1.34 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 6vw 6vh;
  }
  #box { max-width: 1400px; text-align: center; }
  .line {
    display: inline-block; margin: 5px 0; padding: 7px 20px;
    background: rgba(8, 10, 16, .76);
    border-radius: 10px;
    color: #fff;
    /* El contorno mantiene el texto legible aunque OBS quite el fondo. */
    text-shadow: 0 2px 10px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.95);
    animation: rise .18s ease-out;
  }
  .line.pending { opacity: .82; }
  .line.src { font-size: .62em; font-weight: 500; opacity: .72; }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } }
  body.clean .line { background: none; }
</style>
</head>
<body>
<div id="box"></div>
<script type="module">
const room = decodeURIComponent(location.pathname.split('/').pop());
const p = new URLSearchParams(location.search);
const lang = p.get('lang') || 'es';
// ?lines=1 para una sola linea, ?clean=1 para quitar el fondo de las cajas,
// ?src=1 para mostrar tambien el idioma original debajo.
const MAX = Math.max(1, parseInt(p.get('lines') || '2', 10));
const showSrc = p.get('src') === '1';
if (p.get('clean') === '1') document.body.classList.add('clean');

let sourceLang = 'en', rows = new Map(), ws;
const box = document.getElementById('box');

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/view/${room}?lang=${lang}`);
  ws.onmessage = ({ data }) => handle(JSON.parse(data));
  ws.onclose = () => setTimeout(connect, 1500);
}

function handle(ev) {
  if (ev.type === 'state') { sourceLang = ev.source_lang || sourceLang; return; }
  if (ev.type === 'translation') {
    const row = rows.get(ev.final ? ev.seq : 'partial');
    if (row) { row.tr = { ...row.tr, ...ev.tr }; render(); }
    return;
  }
  if (ev.type !== 'segment') return;

  if (ev.final) rows.delete('partial');
  const key = ev.final ? ev.seq : 'partial';
  const row = rows.get(key) || { tr: {} };
  row.text = ev.text;
  row.final = ev.final;
  rows.set(key, row);

  // Solo sobreviven las ultimas MAX lineas: un overlay que crece tapa al orador.
  const keys = [...rows.keys()];
  for (const k of keys.slice(0, Math.max(0, keys.length - MAX))) rows.delete(k);
  render();
}

function render() {
  box.innerHTML = '';
  for (const row of rows.values()) {
    const main = lang === sourceLang ? row.text : (row.tr[lang] ?? row.text);
    const el = document.createElement('div');
    el.className = 'line' + (row.final ? '' : ' pending');
    el.textContent = main;
    box.appendChild(el);
    box.appendChild(document.createElement('br'));
    if (showSrc && lang !== sourceLang && row.tr[lang]) {
      const s = document.createElement('div');
      s.className = 'line src';
      s.textContent = row.text;
      box.appendChild(s);
      box.appendChild(document.createElement('br'));
    }
  }
}
connect();
</script>
</body>
</html>
