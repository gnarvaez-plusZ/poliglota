[project]
name = "poliglota"
version = "0.1.0"
description = "Subtitulado y traduccion simultanea en tiempo real para conferencias multi-sala"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "qrcode>=7.4",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1", "onnxruntime>=1.20"]
# Identificacion de hablante neuronal. Sin esto se usa un embedder clasico sin dependencias.
voces = ["resemblyzer>=0.1.3", "torch>=2.2"]

[project.scripts]
poliglota = "poliglota.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poliglota"]
